<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">

  <link rel="stylesheet" href="/store/bootstrap-4.3.1.min.css"
    integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">

  <link rel="stylesheet" href="/store/adyen-application.css">

  <title>Checkout Demo</title>
</head>

<body>
  <header id="header">
    <a href="/store/">
      <img src="/store/images/mystore-logo.svg" alt="">
    </a>
  </header>
  <div class="container">
    <main class="preview-page">
  <section class="cart">
    <h2>Cart</h2>
    <div class="order-summary">
      <ul class="order-summary-list">
        <li class="order-summary-list-list-item">
          <img src="/store/images/sunglasses.png" class="order-summary-list-list-item-image" alt="">
          <p class="order-summary-list-list-item-title">Sunglasses</p>
          <p class="order-summary-list-list-item-price">50.00</p>
        </li>
        <li class="order-summary-list-list-item">
          <img src="/store/images/headphones.png" class="order-summary-list-list-item-image" alt="">
          <p class="order-summary-list-list-item-title">Headphones</p>
          <p class="order-summary-list-list-item-price">50.00</p>
        </li>
      </ul>
    </div>
    <div class="cart-footer"><span class="cart-footer-label">Total:</span><span
        class="cart-footer-amount">100.00</span>
      <a href="/store/checkout?type=dropin">
        <p class="button">Continue to checkout</p>
      </a>
    </div>
  </section>
</main>

  </div>
  <script type="module" src="/store/app.js"></script>
</body>

</html>
